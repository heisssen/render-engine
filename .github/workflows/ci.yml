name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every Python file
        run: python -m py_compile en/*.py scripts/*.py tools/*.py tests/*.py
      - name: Unit tests (provenance ledger and licence gate)
        run: python -m unittest discover tests -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check of the Node scripts
        run: for f in en/*.mjs scripts/*.mjs; do node --check "$f"; done
      - name: Every relative import resolves
        run: node scripts/check_imports.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the CLI over the whole history (the gitleaks action trips over a repository's very first push)
      - name: gitleaks, full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
